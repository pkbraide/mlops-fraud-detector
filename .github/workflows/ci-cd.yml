name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, format check and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests (pytest)
        run: pytest -v

      - name: Build Docker image
        run: docker build -t mlops-fraud-detector:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --rm --name fraud-api -p 8000:8000 mlops-fraud-detector:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/ | tee health.json
          grep -q '"status":"healthy"' health.json
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"amount": 5000, "distance_from_home": 120.0, "use_chip": 0}' | tee predict.json
          grep -q '"model_version":"joblib_model"' predict.json
          docker stop fraud-api
